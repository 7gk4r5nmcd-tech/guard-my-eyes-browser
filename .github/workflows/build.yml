name: Build

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  ios:
    name: iPhone (.ipa tanpa tanda tangan)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Siapkan model AI & skrip (assets/)
        run: |
          npm install --no-audit --no-fund
          node tools/build-assets.mjs

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Buat folder platform yang belum ada
        run: flutter create --platforms=ios,android --org com.guardmyeyes --project-name guard_my_eyes_browser .

      - name: Izinkan http (server AI lokal di dalam aplikasi)
        run: |
          PL=ios/Runner/Info.plist
          /usr/libexec/PlistBuddy -c "Delete :NSAppTransportSecurity" $PL || true
          /usr/libexec/PlistBuddy -c "Add :NSAppTransportSecurity dict" $PL
          /usr/libexec/PlistBuddy -c "Add :NSAppTransportSecurity:NSAllowsArbitraryLoads bool true" $PL
          /usr/libexec/PlistBuddy -c "Add :NSAppTransportSecurity:NSAllowsLocalNetworking bool true" $PL
          /usr/libexec/PlistBuddy -c "Set :CFBundleDisplayName Guard My Eyes" $PL || /usr/libexec/PlistBuddy -c "Add :CFBundleDisplayName string Guard My Eyes" $PL

      - run: flutter pub get

      - name: Siapkan Podfile & matikan tanda tangan untuk plugin
        run: |
          flutter build ios --config-only --release --no-codesign
          perl -0pi -e "s/(flutter_additional_ios_build_settings\(target\)\n)/\$1    target.build_configurations.each { |c| c.build_settings['CODE_SIGNING_ALLOWED'] = 'NO'; c.build_settings['CODE_SIGNING_REQUIRED'] = 'NO' }\n/" ios/Podfile
          grep -n "CODE_SIGNING_ALLOWED" ios/Podfile

      - name: Build
        run: |
          flutter build ios --release --no-codesign -v > build.log 2>&1 || {
            echo "===== ERROR LINES ====="
            grep -nE "error:|BUILD FAILED|Signing for|requires a development team|Error \(Xcode\)" build.log | tail -80
            echo "===== TAIL ====="
            tail -120 build.log
            exit 1
          }

      - name: Bungkus jadi .ipa
        run: |
          mkdir -p Payload
          cp -R build/ios/iphoneos/Runner.app Payload/
          zip -qr GuardMyEyes.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: GuardMyEyes-iPhone
          path: GuardMyEyes.ipa

  android:
    name: Android (.apk)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Siapkan model AI & skrip (assets/)
        run: |
          npm install --no-audit --no-fund
          node tools/build-assets.mjs

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Buat folder platform yang belum ada
        run: flutter create --platforms=ios,android --org com.guardmyeyes --project-name guard_my_eyes_browser .

      - name: Izin internet & http
        run: |
          M=android/app/src/main/AndroidManifest.xml
          grep -q 'android.permission.INTERNET' $M || sed -i 's#<application#<uses-permission android:name="android.permission.INTERNET"/>\n    <application#' $M
          sed -i 's#<application#<application android:usesCleartextTraffic="true"#' $M
          sed -i 's#android:label="guard_my_eyes_browser"#android:label="Guard My Eyes"#' $M
          cat $M

      - run: flutter pub get

      - name: Tambal plugin WebView untuk Gradle baru
        run: |
          for f in ~/.pub-cache/hosted/pub.dev/flutter_inappwebview_android-*/android/build.gradle; do
            sed -i "s/proguard-android.txt/proguard-android-optimize.txt/" "$f"
            grep -n "proguard" "$f" || true
          done

      - name: Build
        run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: GuardMyEyes-Android
          path: build/app/outputs/flutter-apk/app-release.apk

  release:
    name: Terbitkan ke halaman Releases
    needs: [ios, android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Guard My Eyes Browser (build ${{ github.run_number }})
          make_latest: true
          files: |
            out/GuardMyEyes-iPhone/GuardMyEyes.ipa
            out/GuardMyEyes-Android/app-release.apk
